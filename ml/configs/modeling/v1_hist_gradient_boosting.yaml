model_name: v1_hist_gradient_boosting
version: 1

training:
  sample_per_class: 200000
  random_seed: 42

model:
  family: HistGradientBoostingClassifier
  learning_rate: 0.1
  max_iter: 300
  max_leaf_nodes: 31
  min_samples_leaf: 50
  l2_regularization: 0.0
  early_stopping: true
  validation_fraction: 0.1
  n_iter_no_change: 20

evaluation:
  primary_metric: validation_macro_f1
  emit_confusion_matrix: true

iteration_notes:
  parent_experiment: sgd_logistic_baseline
  motivation:
    - Replace a linear classifier with a nonlinear tree model.
    - Reduce extreme majority-class bias observed in V0.
    - Use a reproducible class-balanced training subset to improve minority-class learning.
