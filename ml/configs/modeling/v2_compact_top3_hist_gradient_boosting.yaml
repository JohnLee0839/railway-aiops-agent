model_name: v2_compact_top3_hist_gradient_boosting
version: 2
reference_model_manifest: metadata/manifests/v1_tree_baseline_manifest.json
reference_ablation_manifest: metadata/manifests/v1_ablation_manifest.json

training:
  sample_per_class: 200000
  random_seed: 42
  batch_size: 100000

feature_selection:
  source_ablation_variant: top3_only
  selected_feature_columns:
    - Distance
    - PacketLoss
    - Latency

model:
  family: HistGradientBoostingClassifier
  learning_rate: 0.1
  max_iter: 300
  max_leaf_nodes: 31
  min_samples_leaf: 50
  l2_regularization: 0.0
  early_stopping: true
  validation_fraction: 0.1
  n_iter_no_change: 20

evaluation:
  primary_metric: validation_macro_f1
  emit_confusion_matrix: true

iteration_notes:
  parent_experiment: v1_hist_gradient_boosting
  motivation:
    - Promote the strongest compact ablation variant into a formal versioned model.
    - Reduce the feature set from 12 engineered inputs to the 3 features that carry almost all signal.
    - Preserve a cleaner, more explainable model for portfolio storytelling and future deployment-oriented work.
